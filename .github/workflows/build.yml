name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild clean build \
            -project HanbookReader.xcodeproj \
            -scheme HanbookReader \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT=$PWD/build

      - name: Package to .ipa
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/HanbookReader.app Payload/
          zip -qr HanbookReader.ipa Payload/

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanbookReader-iOS12
          path: HanbookReader.ipa
